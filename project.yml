name: ExpenseTracker
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  ExpenseCore:
    path: Packages/ExpenseCore
targets:
  ExpenseTracker:
    type: application
    platform: iOS
    sources:
      - path: ExpenseTracker
    dependencies:
      - package: ExpenseCore
    settings:
      base:
        # Change the bundle id to something unique to you, and set your Team in Xcode (Signing & Capabilities).
        PRODUCT_BUNDLE_IDENTIFIER: com.example.expensetracker
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Expense Tracker
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
