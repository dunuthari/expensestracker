name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: ExpenseCore tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test parsers, periods, money and reports
        working-directory: Packages/ExpenseCore
        run: swift test

  build-app:
    name: Build app
    runs-on: macos-15
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ExpenseTracker.xcodeproj \
            -scheme ExpenseTracker \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -n 200
      - name: Package unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ExpenseTracker.app Payload/
          zip -qr ExpenseTracker-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ExpenseTracker-unsigned-ipa
          path: ExpenseTracker-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ExpenseTracker-xcodeproj
          path: ExpenseTracker.xcodeproj

  screenshots:
    name: Simulator screenshots
    runs-on: macos-15
    needs: core-tests
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "Using simulator $UDID"
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project ExpenseTracker.xcodeproj \
            -scheme ExpenseTracker \
            -sdk iphonesimulator \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tail -n 100
      - name: Boot and install
        run: |
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/ExpenseTracker.app
      - name: Launch each tab in light and dark and take screenshots
        run: |
          mkdir -p shots
          names=(home income report inbox settings)
          for mode in light dark; do
            xcrun simctl ui "$UDID" appearance "$mode"
            for i in 0 1 2 3 4; do
              xcrun simctl launch --terminate-running-process "$UDID" com.example.expensetracker -demoData YES -startTab "$i"
              sleep 6
              xcrun simctl io "$UDID" screenshot "shots/${names[$i]}-$mode.png"
            done
          done
          ls -la shots
      - name: Crash reports
        if: always()
        run: |
          mkdir -p crashes
          cp ~/Library/Logs/DiagnosticReports/*ExpenseTracker* crashes/ 2>/dev/null || true
          ls -la crashes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshots
          path: |
            shots
            crashes
      - name: Publish screenshots to the ci-screenshots branch
        if: always()
        run: |
          mkdir -p /tmp/publish
          cp -R shots crashes /tmp/publish/ 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan ci-screenshots
          git rm -rf . -q || true
          cp -R /tmp/publish/. .
          git add shots crashes 2>/dev/null || true
          git commit -m "Simulator screenshots for ${GITHUB_SHA}" || true
          git push --force origin ci-screenshots
