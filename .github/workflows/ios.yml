name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: ExpenseCore tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test parsers, periods, money and reports
        working-directory: Packages/ExpenseCore
        run: swift test

  build-app:
    name: Build app
    runs-on: macos-15
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ExpenseTracker.xcodeproj \
            -scheme ExpenseTracker \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -n 200
      - name: Package unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ExpenseTracker.app Payload/
          zip -qr ExpenseTracker-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ExpenseTracker-unsigned-ipa
          path: ExpenseTracker-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ExpenseTracker-xcodeproj
          path: ExpenseTracker.xcodeproj
